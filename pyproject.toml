[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csublineola-snp-virulence"
version = "1.0.0"
description = "Reproducible analysis of RAD-seq marker relatedness, geographic structure, virulence profiles, and isolate-panel design in Colletotrichum sublineola"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.12,<2",
]

[project.scripts]
csub-snp-virulence = "csub_snp_virulence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/EJSAHN/csublineola-genome-virulence"
